<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journals — heyDipo</title>
  <link rel="icon" type="x-icon" href="/assets/general/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #06162c;
      --deep: #0b2346;
      --azure: #46b4ff;
      --sky: #8ad3ff;
      --cyan: #b5f1ff;
      --glass-bg: rgba(135, 206, 235, 0.12);
      --glass-border: rgba(173, 216, 230, 0.3);
      --shadow: 0 8px 32px rgba(0, 40, 80, 0.4);
      --text: #e8f6ff;
      --muted: #b8d6ea;
      --transition: 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top, #173c6b 0%, #07192f 45%, #040b18 100%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── Page layout ── */
    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── Top bar: admin bar only ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 2rem;
      margin-bottom: 1.5rem;
    }

    /* ── Admin bar ── */
    #adminBar {
      display: none;
      align-items: center;
      gap: 0.75rem;
    }

    #adminBar.visible {
      display: flex;
    }

    .admin-label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(138, 211, 255, 0.35);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .logout-btn:hover {
      border-color: var(--sky);
      color: var(--sky);
    }

    /* ── Page header ── */
    .page-header {
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .page-header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── Formatting toolbar ── */
    .format-toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .format-btn {
      background: rgba(6, 22, 44, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      line-height: 1.4;
    }

    .format-btn:hover {
      border-color: var(--sky);
      color: var(--sky);
      background: rgba(70, 180, 255, 0.12);
    }

    .format-btn code {
      font-size: 0.75rem;
      background: none;
      border: none;
      color: inherit;
      padding: 0;
    }

    /* ── Composer ── */
    #composer {
      display: none;
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow);
    }

    #composer.visible {
      display: block;
    }

    .composer-textarea {
      width: 100%;
      background: rgba(6, 22, 44, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      min-height: 100px;
      transition: var(--transition);
    }

    .composer-textarea:focus {
      outline: none;
      border-color: var(--sky);
      box-shadow: 0 0 0 2px rgba(138, 211, 255, 0.2);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.75rem;
      gap: 1rem;
    }

    .char-count {
      font-size: 0.8rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .char-count.over {
      color: #ff9999;
    }

    .publish-btn {
      border: none;
      border-radius: 20px;
      padding: 10px 22px;
      font-weight: 500;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      background: linear-gradient(120deg, var(--sky), var(--azure));
      color: #06162c;
      box-shadow: 0 6px 16px rgba(70, 180, 255, 0.3);
      flex-shrink: 0;
    }

    .publish-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(70, 180, 255, 0.45);
    }

    .publish-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ── Feedback banners ── */
    .feedback {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      margin-top: 0.75rem;
      display: none;
      line-height: 1.4;
    }

    .feedback.success {
      display: block;
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid rgba(76, 175, 80, 0.4);
      color: #a8e6a1;
    }

    .feedback.error {
      display: block;
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid rgba(244, 67, 54, 0.4);
      color: #ff9999;
    }

    /* ── Timeline ── */
    #timeline {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ── Post card ── */
    .post-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 1.25rem 1.5rem;
      transition: border-color var(--transition);
    }

    .post-card:hover {
      border-color: rgba(138, 211, 255, 0.5);
    }

    .post-content {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 0.85rem;
    }

    .post-content strong {
      color: var(--sky);
      font-weight: 600;
    }

    .post-content em {
      color: inherit;
      font-style: italic;
    }

    .post-content u {
      text-decoration: underline;
      text-decoration-color: var(--sky);
      text-underline-offset: 3px;
    }

    .post-content s {
      color: var(--muted);
      text-decoration: line-through;
    }

    .post-content code {
      background: rgba(70, 180, 255, 0.12);
      border: 1px solid var(--glass-border);
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.88rem;
      color: var(--cyan);
    }

    .post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .post-meta {
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.85;
    }

    /* ── Admin controls per post ── */
    .post-admin-controls {
      display: none;
      gap: 0.5rem;
      margin-left: auto;
    }

    .post-admin-controls.visible {
      display: flex;
    }

    .admin-action-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 5px 12px;
      font-size: 0.78rem;
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .admin-action-btn:hover {
      border-color: var(--sky);
      color: var(--sky);
    }

    .admin-action-btn.danger:hover {
      border-color: rgba(244, 67, 54, 0.6);
      color: #ff9999;
    }

    /* ── Inline edit ── */
    .edit-area {
      display: none;
    }

    .edit-area.visible {
      display: block;
      margin-top: 0.75rem;
    }

    .edit-textarea {
      width: 100%;
      background: rgba(6, 22, 44, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.93rem;
      line-height: 1.6;
      resize: vertical;
      min-height: 80px;
      transition: var(--transition);
    }

    .edit-textarea:focus {
      outline: none;
      border-color: var(--sky);
      box-shadow: 0 0 0 2px rgba(138, 211, 255, 0.2);
    }

    .edit-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .save-btn {
      background: linear-gradient(120deg, var(--sky), var(--azure));
      color: #06162c;
      border: none;
      border-radius: 12px;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .save-btn:hover:not(:disabled) {
      opacity: 0.9;
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .cancel-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 7px 16px;
      font-size: 0.82rem;
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .cancel-btn:hover {
      border-color: var(--muted);
    }

    /* ── Inline delete confirm ── */
    .delete-confirm {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .delete-confirm.visible {
      display: flex;
    }

    .confirm-delete-btn {
      background: rgba(244, 67, 54, 0.2);
      border: 1px solid rgba(244, 67, 54, 0.5);
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 0.8rem;
      color: #ff9999;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .confirm-delete-btn:hover {
      background: rgba(244, 67, 54, 0.3);
    }

    .cancel-delete-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .cancel-delete-btn:hover {
      border-color: var(--muted);
    }

    /* ── Special states ── */
    .state-panel {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--muted);
      display: none;
    }

    .state-panel.visible {
      display: block;
    }

    .state-panel .icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      display: block;
    }

    .state-panel p {
      font-size: 0.95rem;
    }

    .retry-btn {
      display: inline-block;
      margin-top: 1rem;
      background: transparent;
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 0.88rem;
      color: var(--muted);
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
    }

    .retry-btn:hover {
      border-color: var(--sky);
      color: var(--sky);
    }

    /* ── Skeleton loader ── */
    .skeleton-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .skeleton-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 1.25rem 1.5rem;
    }

    .skeleton-line {
      background: rgba(138, 211, 255, 0.08);
      border-radius: 6px;
      height: 12px;
      margin-bottom: 10px;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-line.short {
      width: 30%;
    }

    .skeleton-line.medium {
      width: 70%;
    }

    .skeleton-line.long {
      width: 90%;
    }

    @keyframes shimmer {
      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .page-wrap {
        padding: 2rem 1rem 4rem;
      }

      .composer-footer {
        flex-direction: column-reverse;
        align-items: flex-end;
      }

      .publish-btn {
        width: 100%;
      }

      .post-card {
        padding: 1rem 1.25rem;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrap">

    <!-- Top bar: admin bar only -->
    <div class="top-bar">
      <div id="adminBar">
        <span class="admin-label" id="adminEmail"></span>
        <button class="logout-btn" id="logoutBtn">Leave this realm</button>
      </div>
    </div>

    <!-- Page header -->
    <div class="page-header">
      <h1>Journals</h1>
      <p>Signals from the in-between.</p>
    </div>

    <!-- Composer (admin only) -->
    <div id="composer">
      <div class="format-toolbar">
        <button type="button" class="format-btn" data-prefix="**" title="Bold"><b>B</b></button>
        <button type="button" class="format-btn" data-prefix="*" title="Italic"><i>I</i></button>
        <button type="button" class="format-btn" data-prefix="__" title="Underline"><u>U</u></button>
        <button type="button" class="format-btn" data-prefix="~~" title="Strikethrough"><s>S</s></button>
        <button type="button" class="format-btn" data-prefix="`" title="Code"><code>&lt;&gt;</code></button>
      </div>
      <textarea class="composer-textarea" id="composerText" placeholder="Transmit a signal…" maxlength="500"
        rows="4"></textarea>
      <div class="composer-footer">
        <span class="char-count" id="charCount">0 / 500</span>
        <button class="publish-btn" id="publishBtn" disabled>Transmit</button>
      </div>
      <div class="feedback" id="composerFeedback"></div>
    </div>

    <!-- Loading skeletons -->
    <div id="loadingState" class="skeleton-list">
      <div class="skeleton-card">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line long"></div>
        <div class="skeleton-line medium"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line long"></div>
        <div class="skeleton-line medium"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line medium"></div>
      </div>
    </div>

    <!-- Error state -->
    <div class="state-panel" id="errorState">
      <span class="icon">🌑</span>
      <p id="errorMsg">The signal couldn't reach this dimension. Try again.</p>
      <button class="retry-btn" id="retryBtn">Reconnect</button>
    </div>

    <!-- Offline state -->
    <div class="state-panel" id="offlineState">
      <span class="icon">🛸</span>
      <p>You've drifted out of range. Restore your connection to the grid.</p>
      <button class="retry-btn" id="offlineRetryBtn">Reconnect</button>
    </div>

    <!-- Empty state -->
    <div class="state-panel" id="emptyState">
      <span class="icon">🪐</span>
      <p>The void is quiet. Transmit the first signal.</p>
    </div>

    <!-- Timeline -->
    <div id="timeline"></div>

  </div>

  <script type="module">
    import { supabase } from '/assets/js/supabase-client.js';

    const MAX_CHARS = 500;

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const adminBar = document.getElementById('adminBar');
    const adminEmailEl = document.getElementById('adminEmail');
    const logoutBtn = document.getElementById('logoutBtn');
    const composer = document.getElementById('composer');
    const composerText = document.getElementById('composerText');
    const charCount = document.getElementById('charCount');
    const publishBtn = document.getElementById('publishBtn');
    const composerFb = document.getElementById('composerFeedback');
    const timeline = document.getElementById('timeline');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const errorMsg = document.getElementById('errorMsg');
    const offlineState = document.getElementById('offlineState');
    const emptyState = document.getElementById('emptyState');
    const retryBtn = document.getElementById('retryBtn');
    const offlineRetryBtn = document.getElementById('offlineRetryBtn');

    // ── State ─────────────────────────────────────────────────────────────────
    let isAdmin = false;
    let currentUserId = null;

    // ── Utilities ─────────────────────────────────────────────────────────────
    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric',
      }) + ' · ' + d.toLocaleTimeString('en-US', {
        hour: '2-digit', minute: '2-digit',
      });
    }

    function showComposerFeedback(type, msg) {
      composerFb.className = 'feedback ' + type;
      composerFb.textContent = msg;
    }

    function clearComposerFeedback() {
      composerFb.className = 'feedback';
      composerFb.textContent = '';
    }

    function showPanel(id) {
      ['loadingState', 'errorState', 'offlineState', 'emptyState'].forEach(pid => {
        const el = document.getElementById(pid);
        if (pid === 'loadingState') {
          el.style.display = pid === id ? 'flex' : 'none';
          el.style.flexDirection = 'column';
        } else {
          el.classList.toggle('visible', pid === id);
        }
      });
      timeline.style.display = id === null ? 'flex' : 'none';
    }

    function hideAllPanels() {
      ['loadingState', 'errorState', 'offlineState', 'emptyState'].forEach(pid => {
        const el = document.getElementById(pid);
        if (pid === 'loadingState') el.style.display = 'none';
        else el.classList.remove('visible');
      });
      timeline.style.display = 'flex';
      timeline.style.flexDirection = 'column';
      timeline.style.gap = '1.25rem';
    }

    // ── XSS & Formatting Parsers ─────────────────────────────────────────────
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderFormattedContent(raw) {
      if (!raw) return '';
      let text = escapeHtml(raw);

      // Inline code: `code`
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Bold: **bold**
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      // Underline: __underline__ or <u>text</u>
      text = text.replace(/__(.+?)__/g, '<u>$1</u>');
      text = text.replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/gi, '<u>$1</u>');

      // Strikethrough: ~~strike~~
      text = text.replace(/~~(.+?)~~/g, '<s>$1</s>');

      // Italic: *italic*
      text = text.replace(/(^|[^*])\*([^*]+?)\*([^*]|$)/g, '$1<em>$2</em>$3');

      return text;
    }

    function applyFormat(textarea, prefix, suffix = prefix) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const text = textarea.value;
      const selected = text.substring(start, end);

      const replacement = prefix + (selected || 'text') + suffix;
      textarea.setRangeText(replacement, start, end, 'select');
      textarea.focus();

      if (!selected) {
        textarea.setSelectionRange(start + prefix.length, start + prefix.length + 4);
      } else {
        textarea.setSelectionRange(start, start + replacement.length);
      }
      textarea.dispatchEvent(new Event('input'));
    }

    // Wire composer toolbar
    document.querySelectorAll('#composer .format-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const prefix = btn.dataset.prefix;
        applyFormat(composerText, prefix);
      });
    });

    // ── Auth ──────────────────────────────────────────────────────────────────
    async function initAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      applyAuthState(session);
    }

    function applyAuthState(session) {
      if (session) {
        isAdmin = true;
        currentUserId = session.user.id;
        adminBar.classList.add('visible');
        adminEmailEl.textContent = session.user.email;
        composer.classList.add('visible');
        // Show admin controls on already-rendered posts
        document.querySelectorAll('.post-admin-controls').forEach(el => {
          el.classList.add('visible');
        });
      } else {
        isAdmin = false;
        currentUserId = null;
        adminBar.classList.remove('visible');
        composer.classList.remove('visible');
        adminEmailEl.textContent = '';
        document.querySelectorAll('.post-admin-controls').forEach(el => {
          el.classList.remove('visible');
        });
      }
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      applyAuthState(session);
    });

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
    });

    // ── Composer ──────────────────────────────────────────────────────────────
    composerText.addEventListener('input', () => {
      const len = composerText.value.length;
      charCount.textContent = `${len} / ${MAX_CHARS}`;
      charCount.classList.toggle('over', len >= MAX_CHARS);
      publishBtn.disabled = len === 0 || len > MAX_CHARS;
      clearComposerFeedback();
    });

    publishBtn.addEventListener('click', async () => {
      const content = composerText.value.trim();
      if (!content || content.length > MAX_CHARS) return;

      publishBtn.disabled = true;
      publishBtn.textContent = 'Transmitting…';
      clearComposerFeedback();

      const { error } = await supabase.from('journals').insert({
        content,
        author_id: currentUserId,
      });

      publishBtn.textContent = 'Transmit';
      publishBtn.disabled = false;

      if (error) {
        showComposerFeedback('error', 'The signal was lost. Try again.');
        return;
      }

      composerText.value = '';
      charCount.textContent = '0 / 500';
      charCount.classList.remove('over');
      showComposerFeedback('success', 'Signal sent.');
      setTimeout(clearComposerFeedback, 3000);
      await loadPosts();
    });

    // ── Fetch & render posts ──────────────────────────────────────────────────
    async function loadPosts() {
      if (!navigator.onLine) {
        showPanel('offlineState');
        return;
      }

      showPanel('loadingState');

      const { data: posts, error } = await supabase
        .from('journals')
        .select('id, content, created_at, updated_at')
        .order('created_at', { ascending: false });

      if (error) {
        errorMsg.textContent = 'The signal couldn\'t reach this dimension. Try again.';
        showPanel('errorState');
        return;
      }

      if (!posts || posts.length === 0) {
        showPanel('emptyState');
        return;
      }

      hideAllPanels();
      renderPosts(posts);
    }

    function renderPosts(posts) {
      timeline.innerHTML = '';
      posts.forEach(post => {
        timeline.appendChild(createPostCard(post));
      });
    }

    function createPostCard(post) {
      const card = document.createElement('article');
      card.className = 'post-card';
      card.dataset.id = post.id;

      const edited = post.updated_at && post.updated_at !== post.created_at
        ? ' · revised' : '';

      card.innerHTML = `
        <div class="post-content">${renderFormattedContent(post.content)}</div>

        <div class="post-footer">
          <div class="post-meta">${formatDate(post.created_at)}${edited}</div>
          <div class="post-admin-controls ${isAdmin ? 'visible' : ''}">
            <button class="admin-action-btn edit-btn">Rewrite</button>
            <button class="admin-action-btn danger delete-btn">Erase</button>
          </div>
        </div>

        <div class="edit-area">
          <div class="format-toolbar" style="margin-bottom: 8px;">
            <button type="button" class="format-btn edit-format-btn" data-prefix="**" title="Bold"><b>B</b></button>
            <button type="button" class="format-btn edit-format-btn" data-prefix="*" title="Italic"><i>I</i></button>
            <button type="button" class="format-btn edit-format-btn" data-prefix="__" title="Underline"><u>U</u></button>
            <button type="button" class="format-btn edit-format-btn" data-prefix="~~" title="Strikethrough"><s>S</s></button>
            <button type="button" class="format-btn edit-format-btn" data-prefix="`" title="Code"><code>&lt;&gt;</code></button>
          </div>
          <textarea class="edit-textarea">${escapeHtml(post.content)}</textarea>
          <div class="edit-actions">
            <button class="save-btn">Seal it</button>
            <button class="cancel-btn">Nevermind</button>
          </div>
        </div>

        <div class="delete-confirm">
          <span>Erase this from the record?</span>
          <button class="confirm-delete-btn">Yes, erase it</button>
          <button class="cancel-delete-btn">Keep it</button>
        </div>
      `;

      wireCardEvents(card, post);
      return card;
    }

    function wireCardEvents(card, post) {
      const contentEl = card.querySelector('.post-content');
      const metaEl = card.querySelector('.post-meta');
      const controls = card.querySelector('.post-admin-controls');
      const editArea = card.querySelector('.edit-area');
      const editTextarea = card.querySelector('.edit-textarea');
      const deleteConfirm = card.querySelector('.delete-confirm');

      const editBtn = card.querySelector('.edit-btn');
      const deleteBtn = card.querySelector('.delete-btn');
      const saveBtn = card.querySelector('.save-btn');
      const cancelEditBtn = card.querySelector('.cancel-btn');
      const confirmDeleteBtn = card.querySelector('.confirm-delete-btn');
      const cancelDeleteBtn = card.querySelector('.cancel-delete-btn');

      // Wire edit format buttons
      card.querySelectorAll('.edit-format-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const prefix = btn.dataset.prefix;
          applyFormat(editTextarea, prefix);
        });
      });

      // ── Edit ──
      editBtn.addEventListener('click', () => {
        editTextarea.value = post.content;
        editArea.classList.add('visible');
        deleteConfirm.classList.remove('visible');
        controls.style.display = 'none';
        editTextarea.focus();
      });

      cancelEditBtn.addEventListener('click', () => {
        editArea.classList.remove('visible');
        controls.style.display = '';
      });

      saveBtn.addEventListener('click', async () => {
        const newContent = editTextarea.value.trim();
        if (!newContent || newContent.length > MAX_CHARS) return;

        saveBtn.disabled = true;
        saveBtn.textContent = 'Sealing…';

        const { data, error } = await supabase
          .from('journals')
          .update({ content: newContent, updated_at: new Date().toISOString() })
          .eq('id', post.id)
          .select()
          .single();

        saveBtn.disabled = false;
        saveBtn.textContent = 'Seal it';

        if (error) {
          alert('The rewrite failed. Try again.');
          return;
        }

        // Update in-place
        post.content = data.content;
        post.updated_at = data.updated_at;
        contentEl.innerHTML = renderFormattedContent(data.content);
        metaEl.textContent = formatDate(data.created_at) + ' · revised';
        editArea.classList.remove('visible');
        controls.style.display = '';
      });

      // ── Delete ──
      deleteBtn.addEventListener('click', () => {
        deleteConfirm.classList.add('visible');
        editArea.classList.remove('visible');
        controls.style.display = 'none';
      });

      cancelDeleteBtn.addEventListener('click', () => {
        deleteConfirm.classList.remove('visible');
        controls.style.display = '';
      });

      confirmDeleteBtn.addEventListener('click', async () => {
        confirmDeleteBtn.disabled = true;
        confirmDeleteBtn.textContent = 'Erasing…';

        const { error } = await supabase
          .from('journals')
          .delete()
          .eq('id', post.id);

        if (error) {
          confirmDeleteBtn.disabled = false;
          confirmDeleteBtn.textContent = 'Yes, erase it';
          alert('Erasure failed. Try again.');
          return;
        }

        card.remove();

        // Show empty state if no posts left
        if (timeline.children.length === 0) {
          showPanel('emptyState');
        }
      });
    }

    // ── Retry buttons ─────────────────────────────────────────────────────────
    retryBtn.addEventListener('click', loadPosts);
    offlineRetryBtn.addEventListener('click', loadPosts);

    window.addEventListener('online', loadPosts);

    // ── Boot ──────────────────────────────────────────────────────────────────
    await initAuth();
    await loadPosts();
  </script>
</body>

</html>
